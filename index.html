<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1b1838">
<title>A little something for you</title>
<style>
:root{
  --sand:#f6e7c8; --sand-edge:#e0c690; --ink:#3b2716; --ink-dim:#7b5f3f;
  --cream:#fff2d6; --cream-dim:#f5d9b5; --amber:#e8894a; --amber-hi:#f19a5c; --danger:#b3412c;
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,serif;
  --sans:ui-rounded,"SF Pro Rounded",Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fox-w:168px; --fox-bottom:50px; --trail-bottom:20px;
  --fox-h:calc(var(--fox-w) * .77);
  --ground-h:calc(var(--fox-bottom) + var(--fox-h) + 6px);
  --plane-h:calc(var(--fox-bottom) + 34px);
}
@media (max-width:560px){:root{--fox-w:128px;--fox-bottom:44px;--trail-bottom:16px}}
@media (max-height:520px){:root{--fox-w:92px;--fox-bottom:30px;--trail-bottom:8px}}

*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{font-family:var(--sans);color:var(--cream);background:#1b1838;-webkit-tap-highlight-color:transparent}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font-family:inherit}
:focus-visible{outline:3px solid #ffd58a;outline-offset:3px}

/* ---------- scene ---------- */
.scene{position:fixed;left:0;right:0;top:0;bottom:0;z-index:0;overflow:hidden;
  background:linear-gradient(180deg,#1b1838 0%,#3b2a5e 32%,#9c4761 64%,#e58c58 88%,#f7bb6e 100%)}
.stars{position:absolute;left:0;right:0;top:0;height:58%}
.star{position:absolute;border-radius:50%;background:#fff6dc;opacity:0;animation:twinkle 3.5s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.95}}
.moon{position:absolute;top:8%;right:11%;width:56px;height:56px;border-radius:50%;
  background:radial-gradient(circle at 34% 32%,#fffaea,#f5e2b2 68%,#e6c98d);
  box-shadow:0 0 46px 12px rgba(255,232,180,.22)}
.dunes{position:absolute;left:0;right:0;background-repeat:repeat-x;background-size:1200px 100%;background-position:0 100%}
.dunes.far{bottom:calc(var(--plane-h) - 6px);height:180px;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%201200%20220%22%20preserveAspectRatio%3D%22none%22%3E%3Cpath%20d%3D%22M0%20118%20Q150%2060%20300%20118%20T600%20118%20T900%20118%20T1200%20118%20V220%20H0%20Z%22%20fill%3D%22%23523670%22%2F%3E%3C%2Fsvg%3E")}
.dunes.mid{bottom:calc(var(--plane-h) - 20px);height:150px;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%201200%20220%22%20preserveAspectRatio%3D%22none%22%3E%3Cpath%20d%3D%22M0%20132%20Q150%2086%20300%20132%20T600%20132%20T900%20132%20T1200%20132%20V220%20H0%20Z%22%20fill%3D%22%238b4a63%22%2F%3E%3Cg%20fill%3D%22%238b4a63%22%3E%3Crect%20x%3D%22816%22%20y%3D%2292%22%20width%3D%2213%22%20height%3D%22128%22%20rx%3D%226.5%22%2F%3E%3Crect%20x%3D%22804%22%20y%3D%22116%22%20width%3D%228%22%20height%3D%2230%22%20rx%3D%224%22%2F%3E%3Crect%20x%3D%22804%22%20y%3D%22138%22%20width%3D%2214%22%20height%3D%228%22%20rx%3D%224%22%2F%3E%3Crect%20x%3D%22833%22%20y%3D%22104%22%20width%3D%228%22%20height%3D%2224%22%20rx%3D%224%22%2F%3E%3Crect%20x%3D%22821%22%20y%3D%22122%22%20width%3D%2214%22%20height%3D%228%22%20rx%3D%224%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E")}
.plane{position:absolute;left:0;right:0;bottom:0;height:var(--plane-h);
  background:linear-gradient(180deg,#cd8a54 0%,#b56f42 55%,#9b5a35 100%);
  box-shadow:inset 0 2px 0 rgba(255,220,160,.35)}

/* ---------- layout ---------- */
.stage{position:relative;z-index:2;height:100vh;height:100dvh;max-width:640px;margin:0 auto;
  display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 16px 0}
.views{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}
.view{display:none;width:100%}
.view.active{display:flex;flex-direction:column;align-items:center}
.ground{position:relative;flex:none;height:var(--ground-h);margin-bottom:env(safe-area-inset-bottom)}

/* ---------- landing ---------- */
.hero{text-align:center;padding:0 6px}
.hero .kicker{width:30px;height:30px;color:var(--cream-dim);opacity:.85;margin:0 auto 10px}
.hero .kicker svg{width:100%;height:100%;fill:currentColor}
.hero h1{margin:0 0 10px;font-family:var(--serif);font-weight:400;font-size:clamp(1.9rem,7vw,2.6rem);line-height:1.15;
  color:var(--cream);text-shadow:0 2px 18px rgba(20,8,40,.55)}
.hero p.sub{margin:0 auto 26px;max-width:32ch;color:var(--cream-dim);font-size:1.02rem;line-height:1.5;text-shadow:0 1px 10px rgba(20,8,40,.5)}
.hero p.sub:empty{display:none}
.btn{background:var(--amber);color:#3a1d0d;border:0;border-radius:999px;padding:14px 30px;font-size:1.05rem;font-weight:700;
  cursor:pointer;box-shadow:0 6px 0 #a95822,0 12px 24px rgba(20,8,30,.35);transition:transform .12s,box-shadow .12s,background .12s}
.btn:hover{background:var(--amber-hi)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a95822,0 6px 14px rgba(20,8,30,.35)}
.btn:disabled{opacity:.6;cursor:default}

/* ---------- cards ---------- */
.card{background:var(--sand);color:var(--ink);border:1px solid var(--sand-edge);border-radius:22px;
  box-shadow:0 18px 40px rgba(20,8,30,.35),inset 0 0 0 4px rgba(255,255,255,.35)}
.pw-card{width:100%;max-width:400px;padding:26px 24px 24px;text-align:center}
.pw-card h2{margin:0 0 4px;font-family:var(--serif);font-weight:400;font-size:1.5rem}
.pw-card p{margin:0 0 16px;color:var(--ink-dim);font-size:.95rem}
.pw-card input{width:100%;background:#fff8e8;border:2px solid #d9b77c;border-radius:999px;color:var(--ink);
  text-align:center;padding:13px 18px;font-family:var(--serif);font-size:1.1rem}
.pw-card input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 4px rgba(232,137,74,.25)}
.pw-card .err{min-height:1.3em;margin:8px 0 6px;color:var(--danger);font-size:.92rem}

/* ---------- reader ---------- */
.reader.active{height:100%;max-height:640px;justify-content:flex-end}
.slide-card{position:relative;flex:1;min-height:0;width:100%;max-width:560px;display:flex;flex-direction:column;padding:22px 24px 20px}
.slide-card::after{content:"";position:absolute;left:50%;top:50%;width:min(62%,220px);aspect-ratio:1;transform:translate(-50%,-46%) rotate(-14deg);pointer-events:none;
  background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22%233b2716%22%3E%3Cellipse%20cx%3D%2212%22%20cy%3D%2216%22%20rx%3D%225.6%22%20ry%3D%224.6%22%2F%3E%3Cellipse%20cx%3D%225.4%22%20cy%3D%2210.6%22%20rx%3D%222.2%22%20ry%3D%223%22%2F%3E%3Cellipse%20cx%3D%229.8%22%20cy%3D%226.6%22%20rx%3D%222.2%22%20ry%3D%223%22%2F%3E%3Cellipse%20cx%3D%2214.2%22%20cy%3D%226.6%22%20rx%3D%222.2%22%20ry%3D%223%22%2F%3E%3Cellipse%20cx%3D%2218.6%22%20cy%3D%2210.6%22%20rx%3D%222.2%22%20ry%3D%223%22%2F%3E%3C%2Fsvg%3E") no-repeat center/contain;opacity:.055}
.slide-viewport{position:relative;flex:1;min-height:0;overflow:hidden}
.slide-page{position:absolute;left:0;right:0;top:0;margin:0;opacity:0}
.slide-page.on{opacity:1}
.slide-page.measure{visibility:hidden;pointer-events:none}
.slide-h{margin:0 0 .75rem;padding-bottom:.5rem;border-bottom:1px dashed var(--sand-edge);font-family:var(--serif);font-weight:400;
  font-size:1.3rem;line-height:2rem;color:var(--ink);overflow-wrap:anywhere}
.slide-b{font-family:var(--serif);font-size:1.0625rem;line-height:1.75rem;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.slide-page.title-only{top:24%;text-align:center}
.slide-page.title-only .slide-h{border:0;font-size:1.9rem;line-height:2.4rem;margin:0;padding:0}
.pager{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;max-width:560px;margin:12px 0 10px}
.pbtn{background:rgba(255,242,214,.14);color:var(--cream);border:1.5px solid rgba(255,242,214,.4);border-radius:999px;
  padding:10px 18px;font-size:.98rem;font-weight:600;cursor:pointer;min-width:104px;transition:background .15s,opacity .15s}
.pbtn:hover:not(:disabled){background:rgba(255,242,214,.26)}
.pbtn:disabled{opacity:.32;cursor:default}
.pager-count{color:var(--cream-dim);font-size:.9rem}
.pager.single{display:none}

/* ---------- fox + trail ---------- */
.fox-pos{position:absolute;left:0;bottom:var(--fox-bottom);width:var(--fox-w);opacity:0;transition:opacity .5s;cursor:pointer;will-change:transform}
.fox-pos.ready{opacity:1}
.fox-shadow{position:absolute;left:12%;right:10%;bottom:calc(var(--fox-w) * .054 - 5px);height:10px;border-radius:50%;background:rgba(40,15,10,.34);filter:blur(3px)}
.fox-flip{transition:transform .2s ease;transform-origin:50% 50%}
.fox-flip.left{transform:scaleX(-1)}
.fox-hop{transform-origin:50% 100%}
.trail{position:absolute;left:0;right:0;bottom:var(--trail-bottom);height:20px;pointer-events:none}
.trail[hidden]{display:none}
.mk{position:absolute;left:0;top:0;width:16px;height:16px;color:#5a3320;opacity:.26;transition:opacity .4s,color .4s}
.mk svg{display:block;width:100%;height:100%;fill:currentColor}
.mk.dot{width:7px;height:7px;border-radius:50%;background:currentColor;margin-top:5px}
.mk.seen{opacity:.7}
.mk.here{color:#fff0c8;opacity:1}
.puff{position:absolute;bottom:calc(var(--fox-bottom) + 2px);width:26px;height:26px;margin-left:-13px;border-radius:50%;
  background:rgba(255,226,180,.55);pointer-events:none}

@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
.shake{animation:shake .45s ease}

@media (max-width:560px){
  .stage{padding-left:12px;padding-right:12px}
  .slide-card{padding:18px 18px 16px}
  .pager{margin:10px 0 8px}
  .pbtn{padding:9px 14px;min-width:92px}
}
@media (max-height:520px){
  .moon{display:none}
  .slide-card{padding:12px 16px}
  .pager{margin:6px 0}
}
@media (prefers-reduced-motion:reduce){
  .star{animation:none;opacity:.6}
  .fox-flip{transition:none}
}

/* ---- fennec fox: idle, walk, and reaction animations ---- */
.fox{display:block;width:100%;height:auto;overflow:visible}
.fox .leg-fn{transform-origin:147px 124px}
.fox .leg-ff{transform-origin:147px 124px}
.fox .leg-bn{transform-origin:86px 122px}
.fox .leg-bf{transform-origin:86px 122px}
.fox .head-wrap{transform-origin:158px 100px}
.fox .ear-n{transform-origin:175px 66px}
.fox .ear-f{transform-origin:198px 66px}
.fox .tail{transform-origin:70px 112px}
.fox .eye{transform-origin:194px 80px}
.fox .body{transform-origin:112px 144px}

@keyframes fx-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes fx-twitch{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(-7deg)}94%{transform:rotate(3deg)}97%{transform:rotate(-3deg)}}
@keyframes fx-tail{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg)}}
@keyframes fx-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.01,1.025)}}
.fox .eye{animation:fx-blink 5.2s infinite}
.fox .ear-n{animation:fx-twitch 6.5s infinite}
.fox .ear-f{animation:fx-twitch 7.8s 1.4s infinite}
.fox .tail{animation:fx-tail 3.4s ease-in-out infinite}
.fox .body{animation:fx-breathe 3.4s ease-in-out infinite}

@keyframes fx-legA{0%,100%{transform:rotate(-26deg)}50%{transform:rotate(24deg)}}
@keyframes fx-legB{0%,100%{transform:rotate(24deg)}50%{transform:rotate(-26deg)}}
@keyframes fx-bob{0%,50%,100%{transform:translateY(0)}25%,75%{transform:translateY(-2.5px)}}
@keyframes fx-tailwalk{0%,100%{transform:rotate(2deg)}50%{transform:rotate(10deg)}}
@keyframes fx-nod{0%,100%{transform:rotate(0)}50%{transform:rotate(-2.5deg)}}
.fox.walking .leg-fn,.fox.walking .leg-bf{animation:fx-legA .56s ease-in-out infinite}
.fox.walking .leg-ff,.fox.walking .leg-bn{animation:fx-legB .56s ease-in-out infinite}
.fox.walking .upper{animation:fx-bob .56s ease-in-out infinite}
.fox.walking .tail{animation:fx-tailwalk .56s ease-in-out infinite}
.fox.walking .head-wrap{animation:fx-nod .56s ease-in-out infinite}

@keyframes fx-nope{0%,100%{transform:rotate(0)}20%{transform:rotate(9deg)}45%{transform:rotate(-8deg)}70%{transform:rotate(6deg)}}
@keyframes fx-droop{0%{transform:rotate(0)}25%,80%{transform:rotate(14deg)}100%{transform:rotate(0)}}
.fox.nope .head-wrap{animation:fx-nope .6s ease-in-out}
.fox.nope .ear-n,.fox.nope .ear-f{animation:fx-droop .7s ease}

@media (prefers-reduced-motion:reduce){.fox *{animation:none !important}}

</style>
</head>
<body>
<noscript><p style="position:relative;z-index:5;padding:24px;text-align:center">This page needs JavaScript to open.</p></noscript>

<div class="scene" aria-hidden="true">

  <div class="moon"></div>

</div>

<main class="stage" id="stage">
  <div class="views">

    <section id="landing" class="view active">
      <div class="hero">
        <div class="kicker" aria-hidden="true"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="16" rx="5.6" ry="4.6"/><ellipse cx="5.4" cy="10.6" rx="2.2" ry="3"/><ellipse cx="9.8" cy="6.6" rx="2.2" ry="3"/><ellipse cx="14.2" cy="6.6" rx="2.2" ry="3"/><ellipse cx="18.6" cy="10.6" rx="2.2" ry="3"/></svg></div>
        <h1>A little something for you</h1>
        <p class="sub">Follow the fox. Open only on laptop.</p>
        <button type="button" class="btn" id="startBtn">Follow the fox</button>
      </div>
    </section>

    <section id="pwscreen" class="view">
      <form class="card pw-card" id="pwform" autocomplete="off">
        <h2>Enter the password</h2>

        <input type="password" id="pwField" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Password">
        <div class="err" id="errMsg" role="status" aria-live="polite"></div>
        <button type="submit" class="btn" id="unlockBtn">Just PullMan</button>
      </form>
    </section>

    <section id="reader" class="view reader">
      <div class="card slide-card" id="slideCard">
        <div class="slide-viewport" id="slideViewport">
          <div class="slide-page measure" id="measure" aria-hidden="true"></div>
          <div class="slide-page" id="textA"></div>
          <div class="slide-page" id="textB"></div>
        </div>
      </div>
      <div class="pager" id="pager">
        <button type="button" class="pbtn" id="prevBtn" aria-label="Previous page">&lsaquo; Back</button>
        <span class="pager-count" id="pageCount"></span>
        <button type="button" class="pbtn" id="nextBtn" aria-label="Next page">Next &rsaquo;</button>
      </div>
    </section>

  </div>

  <div class="ground" id="ground">
    <div class="trail" id="trail" hidden></div>
    <div class="fox-pos" id="foxPos">
      <div class="fox-shadow" id="foxShadow"></div>
      <div class="fox-flip" id="foxFlip"><div class="fox-hop" id="foxHop"><svg class="fox" viewBox="0 0 260 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A fennec fox">
  <defs>
    <linearGradient id="fxBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2a862"/>
      <stop offset=".55" stop-color="#eec78f"/>
      <stop offset="1" stop-color="#f8e4c0"/>
    </linearGradient>
    <linearGradient id="fxHead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6b473"/>
      <stop offset="1" stop-color="#f3d7a8"/>
    </linearGradient>
    <clipPath id="fxTailClip">
      <path d="M68 104 C48 98 26 108 18 130 C12 148 20 166 38 172 C50 176 60 168 56 158 C52 148 58 138 74 132 Z"/>
    </clipPath>
  </defs>

  <!-- far legs (behind the body) -->
  <g transform="translate(-9 0)"><g class="leg leg-bf">
    <path fill="#c99760" d="M74 118 C68 134 74 150 84 158 L84 176 C79 178 77 186 84 186 L97 186 C102 186 101 178 96 176 L96 158 C104 148 104 132 98 118 Z"/>
  </g></g>
  <g transform="translate(9 0)"><g class="leg leg-ff">
    <path fill="#c99760" d="M139 122 L155 122 C155 140 153 160 152 176 C158 178 160 186 154 186 L141 186 C136 186 137 178 143 176 C142 160 140 140 139 122 Z"/>
  </g></g>

  <!-- near legs (also tucked behind the body so hips blend in) -->
  <g class="leg leg-bn">
    <path fill="#efcf9c" d="M74 118 C68 134 74 150 84 158 L84 176 C79 178 77 186 84 186 L97 186 C102 186 101 178 96 176 L96 158 C104 148 104 132 98 118 Z"/>
  </g>
  <g class="leg leg-fn">
    <path fill="#efcf9c" d="M139 122 L155 122 C155 140 153 160 152 176 C158 178 160 186 154 186 L141 186 C136 186 137 178 143 176 C142 160 140 140 139 122 Z"/>
  </g>

  <g class="upper">
    <!-- tail with dark tip -->
    <g class="tail">
      <path fill="#e8bb7d" d="M68 104 C48 98 26 108 18 130 C12 148 20 166 38 172 C50 176 60 168 56 158 C52 148 58 138 74 132 Z"/>

      <path d="M199 85 Q207 89 214 88" fill="none" stroke="#5a3a22" stroke-width="1.4" stroke-linecap="round"/>
      <g class="eye">
        <ellipse cx="194" cy="80" rx="5" ry="6" fill="#2a190f"/>
        <circle cx="196" cy="77.6" r="1.8" fill="#fff"/>
      </g>
      <ellipse cx="221" cy="87.5" rx="4.6" ry="3.6" fill="#34200f"/>

</svg>
</div></div>
    </div>
  </div>
</main>
<div class="sr-only" id="live" role="status" aria-live="polite"></div>

<script>

  work.push(plan.run());
  return Promise.all(work).then(function(){
    out.getAnimations().forEach(function(a){ a.cancel(); });
    inn.getAnimations().forEach(function(a){ a.cancel(); });
    out.classList.remove("on"); inn.classList.add("on");
    cur = inn; nxt = out; nxt.textContent = "";
    pageIndex = newIndex; steps++; busy = false;
    if (pageIndex === 0) face(false);
    updateUI();
    $("live").textContent = "Page " + (pageIndex + 1) + " of " + pages.length;
    if (document.activeElement && document.activeElement.disabled) (pageIndex === 0 ? nextBtn : prevBtn).focus();
  });
}

function repaginate(){
  if (busy){ setTimeout(repaginate, 250); return; }
  var cp = pages[pageIndex] || {slide: 0, start: 0};
  pages = paginate(slides);
  pageIndex = pageFor(cp.slide, cp.start);
  makePage(cur, pages[pageIndex]);
  buildTrail(); setParallax(pageIndex); setFoxX(xForIndex(pageIndex, pages.length)); updateUI();
}

/* ---------- opening the letter ---------- */
function openReader(res){
  slides = res.s;
  var joy = hopOnce(foxX, foxX, 640);
  Promise.all([fadeOut($("pwscreen")), joy]).then(function(){
    var pw = $("pwscreen");
    pw.getAnimations().forEach(function(a){ a.cancel(); });
    pw.classList.remove("active"); reader.classList.add("active");
    pages = paginate(slides); pageIndex = 0; readerOpen = true;
    cur = $("textA"); nxt = $("textB");
    makePage(cur, pages[0]); cur.classList.add("on"); nxt.classList.remove("on"); nxt.textContent = "";
    buildTrail(); setParallax(0); updateUI();
    $("live").textContent = "Opened. Page 1 of " + pages.length;
    fadeIn(reader);
    planMove(xForIndex(0, pages.length), "walk").run().then(function(){ face(false); });
  });
}

/* ---------- wiring ---------- */
var pwField = $("pwField"), errMsg = $("errMsg"), unlockBtn = $("unlockBtn"), checking = false;

$("startBtn").addEventListener("click", function(){
  if (busy) return;
  busy = true;
  var hop = hopOnce(foxX, foxX, 620);
  swapView($("landing"), $("pwscreen")).then(function(){ pwField.focus({preventScroll:true}); });
  hop.then(function(){ busy = false; });
});

function nope(){
  fox.classList.remove("nope"); void fox.getBoundingClientRect(); fox.classList.add("nope");
  setTimeout(function(){ fox.classList.remove("nope"); }, 800);
  var card = $("pwform"); card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
}
$("pwform").addEventListener("submit", function(e){
  e.preventDefault();
  if (checking || !pwField.value) return;
  if (!(window.crypto && crypto.subtle)){ errMsg.textContent = "Your browser blocked decryption at this address. Open the page from its https link, or as a downloaded file."; return; }
  checking = true; unlockBtn.disabled = true; errMsg.textContent = "Sniffing it out…";
  firstSuccess(PAYLOADS.map(function(p){ return decryptOne(pwField.value, p); })).then(function(res){
    checking = false; errMsg.textContent = ""; openReader(res);
  }, function(){
    checking = false; unlockBtn.disabled = false;
    errMsg.textContent = "That’s not the right password.";
    nope(); pwField.value = ""; pwField.focus();
  });
});

prevBtn.addEventListener("click", function(){ goTo(pageIndex - 1); });
nextBtn.addEventListener("click", function(){ goTo(pageIndex + 1); });
document.addEventListener("keydown", function(e){
  if (!readerOpen || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === "ArrowRight" || e.key === "PageDown") goTo(pageIndex + 1);
  else if (e.key === "ArrowLeft" || e.key === "PageUp") goTo(pageIndex - 1);
});
(function(){
  var card = $("slideCard"), x0 = 0, y0 = 0;
  card.addEventListener("touchstart", function(e){ var t = e.changedTouches[0]; x0 = t.clientX; y0 = t.clientY; }, {passive:true});
  card.addEventListener("touchend", function(e){
    var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.4) goTo(pageIndex + (dx < 0 ? 1 : -1));
  }, {passive:true});
})();
foxPos.addEventListener("click", function(){
  if (busy) return;
  busy = true; if (readerOpen) updateUI();
  hopOnce(foxX, foxX, 620).then(function(){ busy = false; if (readerOpen) updateUI(); });
});

var rt = null;
window.addEventListener("resize", function(){
  clearTimeout(rt);
  rt = setTimeout(function(){
    if (readerOpen) repaginate(); else setFoxX(xForIndex(0, 1));
  }, 150);
});

setFoxX(xForIndex(0, 1)); setParallax(0);
requestAnimationFrame(function(){ foxPos.classList.add("ready"); });
})();
</script>
